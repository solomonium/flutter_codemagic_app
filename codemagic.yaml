workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "dev"
          include: true
      cancel_previous_builds: false
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # - shorebird_credentials
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.solo.flutterCodemagicApp
    integrations:
      app_store_connect: SolomonAPIKey
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      # - name: Timeout test
      #   script: |
      #     # Will timeout after 30s but continue script
      #     sleep 2000 || echo "Timeout simulated - continuing"
      #     echo "Running post-timeout operations"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Get the latest build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number $APP_APPLE_ID)
          cd ./ios
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
          agvtool new-marketing-version $(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
          echo "Updated build number to $(($LATEST_BUILD_NUMBER + 1)) and version to $(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2

      # - name: Increment build number
      #   script: |
      #     cd "$CM_BUILD_DIR"

      #     # LATEST_VERSION="7.0.0"
      #     LATEST_VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
      #     echo "App Version: $LATEST_VERSION"

      #     # 2. Fetch the latest build number from App Store Connect
      #     LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
      #     # LATEST_VERSION=$(app-store-connect apps app-store-versions --version-id $APP_STORE_APPLE_ID)

      #     # Debug output
      #     echo "LATEST Version: $LATEST_VERSION"
      #     echo "Latest Build Number: $LATEST_BUILD_NUMBER"

      #     # 3. Validate build number
      #     if [[ -z "$LATEST_BUILD_NUMBER" ]]; then
      #         echo "Error: Could not fetch build number!"
      #         exit 1
      #     fi

      #     # 4. Parse LATEST version and increment using build number
      #     if [[ $LATEST_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
      #         major=${BASH_REMATCH[1]}
      #         minor=${BASH_REMATCH[2]}

      #         # Use build number +1 as the new patch version
      #         NEW_VERSION="$major.$minor.$((LATEST_BUILD_NUMBER + 1))"
      #         NEW_BUILD_NUMBER="$NEW_VERSION"  # Keep them synchronized

      #         echo "New Version: $NEW_VERSION"
      #         echo "New Build Number: $NEW_BUILD_NUMBER"

      #         # 5. Update Xcode project
      #         cd ios
      #         agvtool new-marketing-version "$NEW_VERSION"  # Updates CFBundleShortVersionString
      #         agvtool new-version -all "$NEW_BUILD_NUMBER"  # Updates CFBundleVersion

      #         echo "Version updated successfully"
      #     else
      #         echo "Error: Invalid LATEST version format '$LATEST_VERSION'"
      #         exit 1
      #     fi
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist="/Users/builder/export_options.plist"
            # --build-name=LATEST_VERSION \
            # --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1)) \
      # - name: CM_EXPORT_DIR
      #   script: cp -r $HOME/Library/Logs/gym "$CM_EXPORT_DIR"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    # artifacts:
    #   - build/ios/iphonesimulator/Runner.app
    publishing:
      # scripts:
      # - name: Check for apk
      #   script: |
      #     apkPath=$(find build -name "*.apk" | head -1)
      #     if [[ -z ${apkPath} ]]
      #     then
      #       echo "No .apk were found"
      #     else
      #       echo "Publishing .apk artifacts"
      #     fi
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: AFTER_APPROVAL
