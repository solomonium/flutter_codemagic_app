workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "dev"
          include: true
      cancel_previous_builds: false
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # - shorebird_credentials
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.solo.flutterCodemagicApp
    integrations:
      app_store_connect: SolomonAPIKey
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"

          # Fetch from TestFlight ONLY
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")

          # Debug output - shows raw values
          echo "RAW VALUES:"
          echo "LATEST_BUILD_NUMBER='$LATEST_BUILD_NUMBER'"

          # Verify we got valid data
          if [[ -z "$LATEST_BUILD_NUMBER" ]]; then
              echo "Error: Could not fetch TestFlight build number!"
              exit 1
          fi

          echo "Using build number: $LATEST_BUILD_NUMBER"

          # Version increment logic
          if [[ $LATEST_BUILD_NUMBER =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              # Case 1: Semantic version (X.Y.Z)
              major=${BASH_REMATCH[1]}
              minor=${BASH_REMATCH[2]}
              patch=${BASH_REMATCH[3]}
              
              patch=$((patch + 1))
              if [[ $patch -ge 10 ]]; then
                  patch=0
                  minor=$((minor + 1))
              fi
              if [[ $minor -ge 10 ]]; then
                  minor=0
                  major=$((major + 1))
              fi
              
              NEW_BUILD_NUMBER="$major.$minor.$patch"
          elif [[ $LATEST_BUILD_NUMBER =~ ^[0-9]+$ ]]; then
              # Case 2: Numeric build number (e.g., 748)
              if [[ -n "$LATEST_VERSION" && $LATEST_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                  major=${BASH_REMATCH[1]}
                  minor=${BASH_REMATCH[2]}
                  patch=${BASH_REMATCH[3]}
                  NEW_BUILD_NUMBER="$major.$minor.$LATEST_BUILD_NUMBER"
              else
                  # Fallback if version isn't available
                  NEW_BUILD_NUMBER="1.0.$LATEST_BUILD_NUMBER"
              fi
          else
              echo "Error: Build number ($LATEST_BUILD_NUMBER) is invalid!"
              exit 1
          fi

          echo "New build number: $NEW_BUILD_NUMBER"
          cd $CM_BUILD_DIR/ios
          agvtool new-version -all "$NEW_BUILD_NUMBER"
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist="/Users/builder/export_options.plist"
            # --build-name=1.0.17 \
            # --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1)) \
      # - name: CM_EXPORT_DIR
      #   script: cp -r $HOME/Library/Logs/gym "$CM_EXPORT_DIR"
    artifacts:
      - $HOME/Library/Logs/gym
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    # artifacts:
    #   - build/ios/iphonesimulator/Runner.app
    publishing:
      scripts:
        - name: Check for apk
          script: |
            apkPath=$(find build -name "*.apk" | head -1)
            if [[ -z ${apkPath} ]]
            then
              echo "No .apk were found"
            else
              echo "Publishing .apk artifacts"
            fi
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: AFTER_APPROVAL

